<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>RBA 8.0.1 · EHS Audit | © NGUYỄN NGỌC NGÔN</title>
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; background:#f4f6fa; color:#0f172a; }
    .hero { background: linear-gradient(120deg,#0b1220 0%,#111c35 55%,#1a2350 100%); }
    .gold { background: linear-gradient(135deg,#f59e0b,#b45309); }
    .card { background:#fff; border:1px solid #e5e9f0; border-radius:16px; box-shadow:0 1px 2px rgba(15,23,42,.04); }
    .scroll::-webkit-scrollbar{width:6px;height:6px}.scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
    .seg button{transition:all .15s}
    .sev-Conformance{background:#ecfdf5;color:#047857;border-color:#6ee7b7}
    .sev-Minor{background:#fefce8;color:#a16207;border-color:#fde047}
    .sev-Major{background:#fff7ed;color:#c2410c;border-color:#fdba74}
    .sev-Priority{background:#fef2f2;color:#b91c1c;border-color:#fca5a5}
    .sev-NA{background:#f8fafc;color:#475569;border-color:#cbd5e1}
    .seg-on-Conformance{background:#059669!important;color:#fff!important;border-color:#059669!important}
    .seg-on-Minor{background:#eab308!important;color:#fff!important;border-color:#eab308!important}
    .seg-on-Major{background:#ea580c!important;color:#fff!important;border-color:#ea580c!important}
    .seg-on-Priority{background:#dc2626!important;color:#fff!important;border-color:#dc2626!important}
    .seg-on-NA{background:#64748b!important;color:#fff!important;border-color:#64748b!important}
    .word-page{background:#fff;padding:34px 42px;box-shadow:0 18px 40px -18px rgba(15,23,42,.25);border-radius:6px;font-family:"Times New Roman",serif;color:#000;line-height:1.42}
    .word-table{width:100%;border-collapse:collapse;margin:8px 0 14px;font-size:13.5px}
    .word-table th,.word-table td{border:1px solid #334155;padding:5px 7px;vertical-align:middle}
    .word-table th{background:#e2e8f0;font-weight:bold;text-align:center}
    .inp{width:100%;border:1px solid #d6dce6;border-radius:10px;padding:8px 11px;font-size:13px;background:#fff;outline:none}
    .inp:focus{border-color:#3b82f6;box-shadow:0 0 0 3px rgba(59,130,246,.12)}
    .inp:disabled{background:#f6f8fb;color:#475569}
    .lbl{display:block;font-size:11px;font-weight:700;color:#64748b;margin-bottom:5px;text-transform:uppercase;letter-spacing:.03em}
    .action-card{transition:transform .15s, box-shadow .15s}
    .action-card:hover{transform:translateY(-2px);box-shadow:0 12px 24px -12px rgba(15,23,42,.35)}
    .action-card.locked{opacity:.45;pointer-events:none}
    html{-webkit-text-size-adjust:100%}
    button,a{-webkit-tap-highlight-color:transparent}
    .hscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
    .hscroll::-webkit-scrollbar{display:none}
    .tab-short{display:none}
    /* ---------- MOBILE (<768px) ---------- */
    @media (max-width: 767px){
      body{background:#eef1f6}
      header .h-16{height:56px}
      header .px-5{padding-left:12px;padding-right:12px}
      header h1{font-size:14px}
      header .text-amber-300{display:none}
      header .lang-select{padding:6px 2px;font-size:12px!important;max-width:64px}
      header h1 + span{display:none}
      .up-sev{flex-basis:100%}
      main{padding:12px 10px!important}
      main.space-y-5 > * + *, #workspace.space-y-5 > * + *{margin-top:12px!important}
      .card{border-radius:14px}
      #welcome .card.p-8{padding:20px 14px}
      /* action buttons: 2 columns, compact */
      #workspace .action-card{padding:10px!important;gap:8px!important;border-radius:14px}
      #workspace .action-card > span:first-child{width:34px;height:34px}
      #workspace .action-card .text-\[11px\]{font-size:10px;line-height:1.25}
      /* status board */
      #workspace .card.p-5{padding:14px}
      #sevCounters{grid-template-columns:repeat(2,minmax(0,1fr))!important}
      #actPack .flex.gap-1{flex-wrap:wrap}
      .tab-panel{scroll-margin-top:66px}
      /* bottom navigation */
      #tabNav{position:fixed;left:0;right:0;bottom:0;z-index:45;margin:0!important;background:rgba(255,255,255,.97);
        backdrop-filter:blur(8px);border-top:1px solid #e2e8f0;box-shadow:0 -6px 20px -10px rgba(15,23,42,.25);
        display:flex!important;flex-wrap:nowrap!important;gap:0!important;padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
      #tabNav > button{flex:1 1 0;min-width:0;flex-direction:column;gap:1px!important;padding:6px 2px!important;font-size:10px!important;
        border-radius:10px;box-shadow:none!important;border:0!important;position:relative;line-height:1.1}
      #tabNav > button > span:first-child{font-size:19px}
      #tabNav .tab-lbl{display:none}
      #tabNav .tab-short{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      #tabNav > button > span:nth-child(4){position:absolute;top:2px;right:calc(50% - 22px);margin:0!important;padding:0 4px!important;font-size:9px!important}
      body:has(#workspace:not(.hidden)) main{padding-bottom:calc(80px + env(safe-area-inset-bottom))!important}
      body:has(#workspace:not(.hidden)) footer{display:none}
      body:has(#workspace:not(.hidden)) #toasts{bottom:calc(76px + env(safe-area-inset-bottom))}
      #r2Confirm{bottom:calc(72px + env(safe-area-inset-bottom))!important}
      /* filters & search */
      #catChips,#r2Chips,#qaChips,#sevChips{flex-wrap:nowrap!important;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:100%}
      #catChips::-webkit-scrollbar,#r2Chips::-webkit-scrollbar,#qaChips::-webkit-scrollbar{display:none}
      #catChips > *,#r2Chips > *,#qaChips > *,#sevChips > *{flex-shrink:0}
      #tab-checklist > .card > div,#tab-qa > .card > div{width:100%}
      #clSearch,#r2Search,#qaSearch{width:100%!important;flex:1 1 auto}
      /* inputs: 16px prevents iOS zoom */
      .inp,select,textarea,input[type=text],input[type=password],input[type=email],input[type=date],input[type=number]{font-size:16px!important}
      /* word preview */
      #wordPreview{padding:16px 14px;overflow-x:auto;font-size:13px}
      #wordPreview table{font-size:11.5px}
      /* storage table -> cards */
      .sto-table thead{display:none}
      .sto-table,.sto-table tbody,.sto-table tr,.sto-table td{display:block;width:100%}
      .sto-table tr{padding:10px 12px;border-bottom:8px solid #eef1f6}
      .sto-table td{padding:3px 0!important;text-align:left!important;white-space:normal!important;border:0}
      .sto-table td[data-lbl]::before{content:attr(data-lbl);display:inline-block;min-width:88px;font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase;letter-spacing:.03em}
      .sto-table td.sto-actions{padding-top:8px!important}
      .sto-table td.sto-actions > div,.sto-table .sto-actions{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-start!important}
      .sto-table .sto-actions button,.sto-table .sto-actions a{min-height:34px;padding-left:10px;padding-right:10px}
      #folderGrid{grid-template-columns:repeat(2,minmax(0,1fr))!important}
      /* account center */
      #accountPanel .hero{padding:10px 12px}
      #accountPanel > .flex-1{flex-direction:column}
      #accNav{width:100%!important;display:flex;gap:6px;overflow-x:auto;border-right:0!important;border-bottom:1px solid #e2e8f0;padding:8px!important;scrollbar-width:none}
      #accNav::-webkit-scrollbar{display:none}
      #accNav > *{flex-shrink:0;margin:0!important;white-space:nowrap;width:auto!important}
      #accBody{padding:12px!important}
      #accBody table{display:block;overflow-x:auto;white-space:nowrap}
      /* dialogs / modals as bottom sheets */
      #dialog,#findModal,#upModal,.sheet-m{align-items:flex-end!important;padding:0!important}
      #dialog > .relative,#findModal > .relative,#upModal > .relative,.sheet-m > .relative{max-width:100%!important;width:100%;border-radius:20px 20px 0 0!important;
        max-height:92vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom);animation:sheetUp .22s ease-out}
      #toasts{left:12px;right:12px;bottom:16px}
      #toasts > *{max-width:100%}
      button{touch-action:manipulation}
    }
    @keyframes sheetUp{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
    @media (min-width:768px) and (max-width:1023px){
      main{padding-left:14px!important;padding-right:14px!important}
      #workspace .grid.lg\:grid-cols-6{grid-template-columns:repeat(3,minmax(0,1fr))}
    }
  </style>
  <meta name="theme-color" content="#0b1220" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="RBA EHS" />
  <link rel="manifest" href="static/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="static/icon.svg" />
  <link rel="apple-touch-icon" href="static/icon-192.png" />
  <link rel="stylesheet" href="static/tailwind.css?v=1e63fb8bec" />
  <script src="web-boot.js?v=d8036a42ff"></script>
</head>
<body class="min-h-screen flex flex-col">

<!-- ============ LOGIN ============ -->
<div id="loginModal" class="fixed inset-0 z-[60] hero flex items-center justify-center p-4">
  <div class="absolute top-4 right-4"><select class="lang-select bg-slate-800 text-white text-xs font-bold rounded-lg px-2.5 py-1.5 border border-slate-600" onchange="setLang(this.value)"></select></div>
  <div class="max-w-sm w-full bg-white rounded-3xl shadow-2xl overflow-hidden">
    <div class="px-7 pt-8 pb-6 text-center">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white font-black flex items-center justify-center text-base shadow-lg">RBA</div>
      <h2 class="mt-4 text-lg font-black text-slate-900" data-i18n="login_title"></h2>
      <p class="text-xs text-slate-500 mt-1" data-i18n="login_sub"></p>
    </div>
    <form onsubmit="handleLogin(event)" class="px-7 space-y-3.5">
      <div id="loginError" class="hidden text-xs font-semibold text-red-700 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>
      <div><label class="lbl" data-i18n="username"></label><input id="loginUsername" class="inp" required autocomplete="username"/></div>
      <div><label class="lbl" data-i18n="password"></label>
        <div class="relative"><input id="loginPassword" type="password" class="inp pr-14" required autocomplete="current-password"/>
          <button type="button" onclick="loginPassword.type=loginPassword.type==='password'?'text':'password'" class="absolute right-3 top-2 text-xs font-bold text-slate-400 hover:text-slate-700" data-i18n="show"></button></div>
      </div>
      <button class="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm" data-i18n="login_btn"></button>
    </form>
    <div id="quickGuestBox" class="px-7 mt-3">
      <div class="flex items-center gap-3 text-[11px] text-slate-400 my-2"><div class="flex-1 h-px bg-slate-200"></div><span data-i18n="or"></span><div class="flex-1 h-px bg-slate-200"></div></div>
      <button onclick="handleGuestLogin()" class="w-full py-2.5 rounded-xl border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold text-sm" data-i18n="guest_btn"></button>
    </div>
    <div class="mt-6 px-7 py-3 bg-slate-50 border-t text-[11px] text-slate-500 flex justify-between">
      <span>RBA 8.0.1</span><span>© <b class="text-slate-800">NGUYỄN NGỌC NGÔN</b></span>
    </div>
  </div>
</div>

<!-- ============ HEADER ============ -->
<header class="hero text-white sticky top-0 z-40">
  <div class="max-w-[1400px] mx-auto px-5 h-16 flex items-center justify-between gap-4">
    <div class="flex items-center gap-3 min-w-0">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center font-black text-sm shrink-0">RBA</div>
      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <h1 class="text-[15px] font-extrabold truncate" data-i18n="app_title"></h1>
          <span class="px-2 py-0.5 rounded-md text-[10px] font-black bg-blue-500/20 text-blue-200 border border-blue-400/30">RBA 8.0.1</span>
        </div>
        <div class="text-[11px] text-amber-300 font-semibold">© <span data-i18n="copyright"></span>: NGUYỄN NGỌC NGÔN</div>
      </div>
    </div>
    <div class="flex items-center gap-2.5">
      <select class="lang-select bg-slate-800/80 text-white text-xs font-bold rounded-lg px-2.5 py-2 border border-slate-600" onchange="setLang(this.value)"></select>
      <button onclick="openAccount()" class="flex items-center gap-2.5 pl-1.5 pr-3 py-1.5 rounded-xl bg-white/10 hover:bg-white/15 border border-white/10">
        <span id="hdrAvatar" class="w-8 h-8 rounded-lg gold flex items-center justify-center font-black text-sm">N</span>
        <span class="text-left leading-tight hidden sm:block">
          <span id="hdrName" class="block text-xs font-bold">—</span>
          <span id="hdrRole" class="block text-[10px] text-slate-300">—</span>
        </span>
        <svg class="w-4 h-4 text-slate-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>
    </div>
  </div>
</header>

<input type="file" id="fileInput" accept=".xlsm,.xlsx" class="hidden" onchange="handleUpload(event, 1)"/>
<input type="file" id="fileInput2" accept=".xlsm,.xlsx" class="hidden" onchange="handleUpload(event, 2)"/>
<input type="file" id="fileSlot" accept=".xlsm,.xlsx" class="hidden" onchange="onSlotFile(event)"/>
<input type="file" id="fileSupp" accept=".xlsm,.xlsx" class="hidden" onchange="onSuppFile(event)"/>

<main class="max-w-[1400px] w-full mx-auto px-5 py-5 space-y-5 flex-1">

  <!-- ============ WELCOME (no input data yet) ============ -->
  <section id="welcome" class="hidden space-y-5">
    <div id="resumeBox" class="hidden card p-4 border-amber-300 bg-amber-50/70 flex flex-wrap items-center justify-between gap-3"></div>
    <div class="card p-8 text-center">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-700 text-white flex items-center justify-center text-2xl">📋</div>
      <h2 class="mt-4 text-xl font-black" data-i18n="welcome_title"></h2>
      <p class="text-sm text-slate-500 mt-1" data-i18n="welcome_sub"></p>
      <div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-4 max-w-4xl mx-auto text-left">
        <button id="wR1" onclick="openFindingUpload()" class="action-card rounded-2xl p-5 bg-gradient-to-br from-blue-600 to-indigo-700 text-white">
          <div class="text-xs font-black uppercase text-blue-200" data-i18n="round1"></div>
          <div class="font-extrabold text-base mt-1" data-i18n="act_upload"></div>
          <div class="text-xs text-blue-100 mt-1" data-i18n="w_r1_d"></div>
        </button>
        <button id="wR2" onclick="startRound2()" class="action-card rounded-2xl p-5 bg-gradient-to-br from-violet-600 to-fuchsia-700 text-white">
          <div class="text-xs font-black uppercase text-violet-200" data-i18n="round2"></div>
          <div class="font-extrabold text-base mt-1" data-i18n="act_upload2"></div>
          <div class="text-xs text-violet-100 mt-1" data-i18n="w_r2_d"></div>
        </button>
        <button id="wOpen" onclick="document.getElementById('tab-storage').scrollIntoView({behavior:'smooth'})" class="action-card rounded-2xl p-5 bg-white border border-slate-200">
          <div class="text-xs font-black uppercase text-slate-400" data-i18n="tab_storage"></div>
          <div class="font-extrabold text-base mt-1 text-slate-900" data-i18n="w_open"></div>
          <div class="text-xs text-slate-500 mt-1" data-i18n="w_open_d"></div>
        </button>
      </div>
    </div>
  </section>

  <!-- ============ WORKSPACE ============ -->
  <section id="workspace" class="hidden space-y-5">
    <!-- workspace bar -->
    <div id="wsBar" class="flex flex-wrap items-center justify-between gap-3"></div>
    <!-- sources: File hiện trường + File tài liệu -->
    <div id="srcBar" class="hidden"></div>

    <!-- export language selector (Việt-Hàn, Việt-Anh, Việt-Trung, Mỗi tiếng Việt) -->
    <div id="expLangBar" class="card px-3.5 py-2.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2.5"></div>

    <!-- primary actions -->
    <div class="grid grid-cols-2 lg:grid-cols-6 gap-3">
      <button id="actUpload" onclick="openFindingUpload()" class="action-card text-left rounded-2xl p-3.5 bg-gradient-to-br from-blue-600 to-indigo-700 text-white flex items-center gap-3 shadow-md">
        <span class="w-10 h-10 rounded-xl bg-white/15 flex items-center justify-center shrink-0 text-lg">⬆</span>
        <span class="min-w-0"><span class="block font-extrabold text-sm" data-i18n="act_upload"></span><span class="block text-[11px] text-blue-100" data-i18n="act_upload_sub"></span></span>
      </button>
      <button id="actUpload2" onclick="startRound2()" class="action-card text-left rounded-2xl p-3.5 bg-gradient-to-br from-violet-600 to-fuchsia-700 text-white flex items-center gap-3 shadow-md">
        <span class="w-10 h-10 rounded-xl bg-white/15 flex items-center justify-center shrink-0 font-black text-xs">L2</span>
        <span class="min-w-0"><span class="block font-extrabold text-sm" data-i18n="act_upload2"></span><span class="block text-[11px] text-violet-100" data-i18n="act_upload2_sub"></span></span>
      </button>
      <button id="actSave" onclick="saveReport()" class="action-card text-left rounded-2xl p-3.5 bg-white border border-slate-200 flex items-center gap-3 shadow-sm">
        <span class="w-10 h-10 rounded-xl bg-amber-100 text-amber-700 flex items-center justify-center shrink-0 text-lg">💾</span>
        <span class="min-w-0"><span class="block font-extrabold text-sm text-slate-900" data-i18n="act_save"></span><span class="block text-[11px] text-slate-500" data-i18n="act_save_sub"></span></span>
      </button>
      <button id="actXlsx" onclick="downloadFile('api/download/xlsx')" class="action-card text-left rounded-2xl p-3.5 bg-white border border-slate-200 flex items-center gap-3 shadow-sm">
        <span class="w-10 h-10 rounded-xl bg-emerald-100 text-emerald-700 flex items-center justify-center shrink-0 font-black text-[10px]">XLSX</span>
        <span class="min-w-0"><span class="block font-extrabold text-sm text-slate-900" data-i18n="act_xlsx"></span><span class="block text-[11px] text-slate-500 truncate" id="actXlsxSub"></span></span>
      </button>
      <button id="actDocx" onclick="downloadFile('api/download/docx')" class="action-card text-left rounded-2xl p-3.5 bg-white border border-slate-200 flex items-center gap-3 shadow-sm">
        <span class="w-10 h-10 rounded-xl bg-sky-100 text-sky-700 flex items-center justify-center shrink-0 font-black text-[10px]">DOCX</span>
        <span class="min-w-0"><span class="block font-extrabold text-sm text-slate-900" data-i18n="act_docx"></span><span class="block text-[11px] text-slate-500 truncate" id="actDocxSub"></span></span>
      </button>
      <div id="actPack" class="action-card rounded-2xl p-3.5 bg-white border border-slate-200 flex items-center gap-3 shadow-sm">
        <span class="w-10 h-10 rounded-xl bg-rose-100 text-rose-700 flex items-center justify-center shrink-0 font-black text-[10px]">PDF</span>
        <span class="min-w-0 flex-1"><span class="block font-extrabold text-sm text-slate-900" data-i18n="act_pack"></span>
          <span class="flex gap-1 mt-1"><button onclick="downloadFile('api/download/pdf')" class="px-2 py-0.5 rounded-md bg-rose-50 text-rose-700 border border-rose-200 text-[10px] font-black">PDF</button><button onclick="downloadFile('api/download/zip')" class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 border border-slate-200 text-[10px] font-black">ZIP</button><button onclick="downloadFile('api/download/finding')" class="px-2 py-0.5 rounded-md bg-slate-100 text-slate-700 border border-slate-200 text-[10px] font-black">FINDING</button></span></span>
      </div>
    </div>

    <!-- status board -->
    <div class="card p-5 grid grid-cols-1 lg:grid-cols-12 gap-5 items-center">
      <div class="lg:col-span-5 flex items-center gap-5">
        <div class="relative w-24 h-24 shrink-0">
          <svg class="w-24 h-24 -rotate-90" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="42" stroke="#eef2f7" stroke-width="10" fill="none"/>
            <circle id="gauge" cx="50" cy="50" r="42" stroke="#2563eb" stroke-width="10" fill="none" stroke-dasharray="263.89" stroke-dashoffset="263.89" stroke-linecap="round" style="transition:all .6s"/>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center">
            <span id="stScore" class="text-2xl font-black leading-none">—</span>
            <span class="text-[10px] text-slate-400 font-bold">/100</span>
          </div>
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2"><span id="stRound" class="px-2 py-0.5 rounded-md text-[10px] font-black"></span><span id="stVendor" class="font-extrabold text-slate-900 truncate">—</span></div>
          <div id="stMeta" class="text-xs text-slate-500 truncate mt-0.5">—</div>

async function api(path, body) {
  const opt = body === undefined ? { headers:H() } : { method:'POST', headers:H(), body:JSON.stringify(body) };
  try {
    const res = await fetch(path, opt);
    const json = await res.json().catch(() => ({ status:'error', message:'HTTP ' + res.status }));
    if (res.status === 401 && SESSION.authenticated && !path.includes('api/auth/')) { SESSION.authenticated = false; await logout(true); loginError.textContent = t('session_expired'); loginError.classList.remove('hidden'); }
    if (!res.ok && json.status !== 'error') json.status = 'error';
    return json;
  } catch (e) { return { status:'error', message:e.message }; }
}

function toast(msg, type = 'ok') {
  const el = document.createElement('div');
  el.className = `px-4 py-3 rounded-xl shadow-lg text-sm font-semibold max-w-sm border ${type === 'err' ? 'bg-red-50 text-red-800 border-red-200' : 'bg-slate-900 text-white border-slate-800'}`;
  el.textContent = msg;
  toasts.appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

/* Generic dialog. fields: {label, value, type:text|password|textarea|checkbox|select, options:[{v,l}]} */
function dialog({ title, message = '', danger = false, okText, fields = [], icon }) {
  return new Promise(resolve => {

    dlgIcon.className = `w-10 h-10 rounded-xl flex items-center justify-center shrink-0 text-lg ${danger ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`;
    dlgIcon.textContent = icon || (danger ? '⚠' : '✎');
    dlgFields.innerHTML = fields.map((f, i) => {
      if (f.type === 'checkbox') return `<label class="flex items-start gap-2.5 text-sm cursor-pointer"><input id="dlgF${i}" type="checkbox" class="w-4 h-4 mt-0.5 accent-blue-600" ${f.value ? 'checked' : ''}/><span>${esc(f.label)}</span></label>`;
      if (f.type === 'radio') return `<div><div class="lbl">${esc(f.label)}</div>${f.options.map((o, j) => `<label class="flex items-start gap-2.5 text-sm cursor-pointer py-1"><input type="radio" name="dlgR${i}" value="${esc(o.v)}" class="w-4 h-4 mt-0.5 accent-blue-600" ${o.v === f.value ? 'checked' : ''}/><span>${esc(o.l)}</span></label>`).join('')}</div>`;
      if (f.type === 'select') return `<div><label class="lbl">${esc(f.label)}</label><select id="dlgF${i}" class="inp">${f.options.map(o => `<option value="${esc(o.v)}" ${o.v === f.value ? 'selected' : ''}>${esc(o.l)}</option>`).join('')}</select></div>`;
      if (f.type === 'textarea') return `<div><label class="lbl">${esc(f.label)}</label><textarea id="dlgF${i}" rows="3" class="inp">${esc(f.value || '')}</textarea></div>`;
      return `<div><label class="lbl">${esc(f.label)}</label><input id="dlgF${i}" type="${f.type || 'text'}" class="inp" value="${esc(f.value || '')}"/></div>`;
    }).join('');
    dlgOk.textContent = okText || t('confirm'); dlgCancel.textContent = t('cancel');
    dlgOk.className = `px-4 py-2 rounded-lg text-white text-sm font-bold ${danger ? 'bg-red-600 hover:bg-red-500' : 'bg-blue-600 hover:bg-blue-500'}`;
    dialog_el().classList.remove('hidden'); dialog_el().classList.add('flex');
    const close = r => { dialog_el().classList.add('hidden'); dialog_el().classList.remove('flex'); dlgOk.onclick = dlgCancel.onclick = null; resolve(r); };
    dlgOk.onclick = () => close({ ok:true, values:fields.map((f, i) => {
      if (f.type === 'checkbox') return document.getElementById('dlgF' + i).checked;
      if (f.type === 'radio') return (document.querySelector(`input[name="dlgR${i}"]:checked`) || {}).value;
      return document.getElementById('dlgF' + i).value;
    }) });
    dlgCancel.onclick = () => close({ ok:false });
    const first = document.getElementById('dlgF0'); if (first && first.type !== 'checkbox') setTimeout(() => first.focus(), 50);
  });
}

async function boot() {

async function handleLogin(e) {
  e.preventDefault();

async function downloadFile(ep) {
  if (isR2() && !r2Confirmed()) return toast(t('r2_need_confirm'), 'err');
  const sep = ep.includes('?') ? '&' : '?';
  return downloadBlob(`${ep}${sep}lang=${encodeURIComponent(EXPORT_LANG)}&token=${encodeURIComponent(TOKEN)}`);
}
async function downloadBlob(url) {
  if (/[?&]lang=/.test(url)) toast(t('exp_busy', { lang:expLangLabel() }));
  else if (/pdf|zip/.test(url)) toast(t('pdf_busy'));
  try {
    const res = await fetch(url, { headers:H() });
    if (!res.ok) { const j = await res.json().catch(() => ({ message:'HTTP ' + res.status })); return toast(j.message, 'err'); }
    const cd = res.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename\*=UTF-8''([^;]+)/) || cd.match(/filename="?([^";]+)"?/);
    const name = m ? decodeURIComponent(m[1]) : 'download';
    const blob = await res.blob();
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  } catch (e) { toast(e.message, 'err'); }
}

async function editFindingVn(no) {
  const f = STATE.findings.find(x => x.no === no);
  if (!f) return;
  const d = await dialog({ title:`${t('edit_vn')} · #${no}`, message:f.issue_en, icon:'✎', okText:t('save'), fields:[{ type:'textarea', label:t('edit_vn_lbl'), value:f.issue_vn }] });
  if (!d.ok || !d.values[0].trim()) return;
  const r = await api('api/finding/vietnamese', { no, vn:d.values[0].trim() });
  if (r.status !== 'ok') { toast(r.message, 'err'); return; }

}
async function postUpdate(body) {
  if (!can('can_edit_checklist')) { toast(t('msg_no_perm'), 'err'); return false; }
  const r = await api('api/update', body);
  if (r.status !== 'ok') { toast(r.message, 'err'); return false; }
  markDirty(r.data); renderAll(); return true;
}
async function setSig(code, sig) { if (await postUpdate({ checklist_overrides:{ [code]:{ significance:sig } } })) toast(`${code} → ${t('sev_' + sig)}`); }
async function saveEvidence(code) { if (await postUpdate({ checklist_overrides:{ [code]:{ evidence_text:document.getElementById('ev_' + code).value } } })) toast(t('msg_saved')); }

function setUpStep(n) { UP.step = n; renderUpSteps(); }

function uploadXHR(url, body, onProgress) {
  return new Promise(resolve => {
    const x = new XMLHttpRequest();
    x.open('POST', url);
    x.setRequestHeader('Content-Type', 'application/json');
    x.setRequestHeader('X-Auth-Token', TOKEN);
    x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.upload.onload = () => onProgress(1, true);
    x.onload = () => { let j; try { j = JSON.parse(x.responseText); } catch (e) { j = { status:'error', message:'HTTP ' + x.status }; } resolve(j); };
    x.onerror = () => resolve({ status:'error', message:'Network error' });
    x.send(JSON.stringify(body));
  });
}

const readB64 = file => new Promise(res => { const r = new FileReader(); r.onload = e => res(e.target.result.split(',')[1]); r.readAsDataURL(file); });

async function handleUpload(ev, round) {
  const file = ev.target.files[0]; ev.target.value = '';
  if (!file) return;
  if (!can(round === 2 ? 'can_upload_round2' : 'can_upload_findings')) return toast(t('msg_no_perm'), 'err');
  if (round !== 2) { FUP.field = file; FUP.doc = null; return submitFindings(); }
  const b64 = await readB64(file);
  return runUpload({ round:2, url:'api/round2/upload', label:file.name,
    payload:{ filename:file.name, file_base64:b64, parent_record_id:PENDING_R2_PARENT } });
}

/* Generic upload flow with the step modal (round 1, round 2, supplement) */
async function runUpload({ round, url, payload, label, title }) {
  UP.error = false; UP.round = round;
  upTitle.textContent = title || (round === 2 ? t('up_title2') : t('up_title'));
  upFile.textContent = label;
  upResult.classList.add('hidden'); upError.classList.add('hidden'); upFoot.classList.add('hidden'); upBarWrap.classList.remove('hidden');
  upBar.style.width = '0%'; upPct.textContent = '0%';
  upModal.classList.remove('hidden'); upModal.classList.add('flex');
  setUpStep(1);
  const timers = [];
  const r = await uploadXHR(url, payload, (p, done) => {
    const pct = Math.round(p * 100); upBar.style.width = pct + '%'; upPct.textContent = pct + '%';
    if (done && UP.step === 1) {
      setUpStep(2); upBarWrap.classList.add('hidden');
      timers.push(setTimeout(() => UP.step === 2 && setUpStep(3), 1200));
      timers.push(setTimeout(() => UP.step === 3 && setUpStep(4), 3000));
    }
  });
  timers.forEach(clearTimeout);
  upBarWrap.classList.add('hidden');
  upFoot.classList.remove('hidden');
  if (r.status !== 'ok') {
    UP.error = true; if (UP.step < 2) UP.step = 2; renderUpSteps();
    upError.textContent = `${t('up_failed')}: ${r.message || ''}`; upError.classList.remove('hidden');
    upView.classList.add('hidden'); return r;
  }
  STATE = r.data; EXPANDED.clear(); R2_EXPANDED.clear(); CAT = 'ALL'; SEVF = 'ALL'; R2F = 'ALL';
  TAB = round === 2 ? 'round2' : 'checklist';
  if (r.storage) STORAGE = r.storage;
  setUpStep(5); renderUpResult(); upResult.classList.remove('hidden'); upView.classList.remove('hidden');
  upView.textContent = round === 2 ? t('r2_view') : t('up_view');
  renderAll(); if (can('can_view_storage')) loadStorage();
  return r;
}

async function deleteBackup(name) {
  const d = await dialog({ title:t('bk_del_title'), message:name, danger:true, okText:t('btn_delete') });
  if (!d.ok) return;
  const r = await api('api/admin/backups/delete', { name });
  if (r.status !== 'ok') return toast(r.message, 'err');
  accBackup();
}

let NOTIFY = null;
async function accNotify() {
  const r = await api('api/admin/notify');
  if (r.status !== 'ok') return toast(r.message, 'err');
  NOTIFY = r.config; const e = NOTIFY.email, z = NOTIFY.zalo, w = NOTIFY.webhook;
  const inp = (id, v, type = 'text') => `<input id="${id}" type="${type}" class="inp" value="${esc(v ?? '')}"/>`;
  const sw = (id, v, lbl) => `<label class="flex items-center gap-2 text-sm font-bold cursor-pointer"><input id="${id}" type="checkbox" class="w-4 h-4 accent-blue-600" ${v ? 'checked' : ''}/>${lbl}</label>`;
  accBody.innerHTML = `<div class="flex items-center justify-between mb-2"><h3 class="text-lg font-black">${t('acc_notify')}</h3>
      <div class="flex gap-2"><button onclick="testNotify()" class="px-3.5 py-2 rounded-xl border border-slate-300 bg-white text-xs font-bold">✉ ${t('n_test')}</button><button onclick="saveNotify()" class="px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold">💾 ${t('n_save')}</button></div></div>
    <div class="text-xs text-slate-600 bg-blue-50 border border-blue-200 rounded-lg p-3 mb-4">ℹ ${t('n_hint')}</div>
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
      <div class="card p-4 space-y-3"><div class="flex items-center justify-between"><b>📧 ${t('n_email')}</b>${sw('nE', e.enabled, t('n_enabled'))}</div>
        <div class="grid grid-cols-3 gap-2"><div class="col-span-2"><label class="lbl">${t('n_host')}</label>${inp('nHost', e.host)}</div><div><label class="lbl">${t('n_port')}</label>${inp('nPort', e.port, 'number')}</div></div>
        <div class="grid grid-cols-2 gap-2"><div><label class="lbl">${t('n_security')}</label><select id="nSec" class="inp">${['starttls','ssl','none'].map(x => `<option ${e.security === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div><div><label class="lbl">${t('n_sender')}</label>${inp('nSender', e.sender)}</div></div>
        <div class="grid grid-cols-2 gap-2"><div><label class="lbl">${t('n_user')}</label>${inp('nUser', e.username)}</div><div><label class="lbl">${t('n_pass')}</label>${inp('nPass', e.password, 'password')}</div></div>
        <div><label class="lbl">${t('n_recipients')}</label><textarea id="nRcpt" rows="2" class="inp">${esc((e.recipients || []).join(', '))}</textarea></div>${sw('nAttach', e.attach_files, t('n_attach'))}</div>
      <div class="space-y-4">
        <div class="card p-4 space-y-3"><div class="flex items-center justify-between"><b>💬 ${t('n_zalo')}</b>${sw('nZ', z.enabled, t('n_enabled'))}</div>
          <div><label class="lbl">${t('n_token')}</label>${inp('nZTok', z.access_token, 'password')}</div><div><label class="lbl">${t('n_uids')}</label>${inp('nZUid', (z.user_ids || []).join(', '))}</div></div>
        <div class="card p-4 space-y-3"><div class="flex items-center justify-between"><b>🔗 ${t('n_webhook')}</b>${sw('nW', w.enabled, t('n_enabled'))}</div><div><label class="lbl">${t('n_url')}</label>${inp('nWUrl', w.url)}</div></div>
        <div class="card p-4"><div class="lbl">${t('n_events')}</div><div class="space-y-1.5">${r.events.map(ev => sw('nEv_' + ev, NOTIFY.events[ev], t('ev_' + ev))).join('')}</div></div>
      </div></div>
    <div class="card mt-4"><div class="px-4 py-2.5 border-b lbl !mb-0">${t('n_log')}</div><div class="divide-y divide-slate-100 max-h-64 overflow-y-auto scroll">${(NOTIFY.log || []).map(l => `<div class="px-4 py-2 text-xs flex justify-between gap-3"><span><b class="${l.ok ? 'text-emerald-600' : 'text-red-600'}">${l.ok ? '✓' : '✕'} ${esc(l.channel)}</b> · ${t('ev_' + l.event)} · <span class="text-slate-500">${esc(l.detail)}</span></span><span class="font-mono text-slate-400 shrink-0">${esc(l.time)}</span></div>`).join('') || '<div class="p-4 text-xs text-slate-400">—</div>'}</div></div>`;
}
function collectNotify() {
  const events = {}; Object.keys(NOTIFY.events).forEach(ev => { const el = document.getElementById('nEv_' + ev); if (el) events[ev] = el.checked; });
  return { email:{ enabled:nE.checked, host:nHost.value.trim(), port:Number(nPort.value || 587), security:nSec.value, sender:nSender.value.trim(), username:nUser.value.trim(), password:nPass.value, recipients:nRcpt.value, attach_files:nAttach.checked },
    zalo:{ enabled:nZ.checked, access_token:nZTok.value, user_ids:nZUid.value }, webhook:{ enabled:nW.checked, url:nWUrl.value.trim() }, events };
}
async function saveNotify() { const r = await api('api/admin/notify/save', { config:collectNotify() }); if (r.status !== 'ok') return toast(r.message, 'err'); toast(t('msg_saved')); accNotify(); }
async function testNotify() { await api('api/admin/notify/save', { config:collectNotify() }); toast(t('pdf_busy')); const r = await api('api/admin/notify/test', {}); if (r.status !== 'ok') return toast(r.message, 'err'); toast(t('n_test_sent')); accNotify(); }

async function accLearning() {
  const r = await api('api/admin/learning');
  if (r.status !== 'ok') return toast(r.message, 'err');
  const sm = r.summary;
  accBody.innerHTML = `<h3 class="text-lg font-black mb-2">${t('acc_learning')}</h3>
    <div class="text-xs text-slate-600 bg-amber-50 border border-amber-200 rounded-lg p-3 mb-4">💡 ${t('l_intro')}</div>
    <div class="space-y-2 mb-5">${r.suggestions.length ? r.suggestions.map(sg => `<div class="card p-4 flex flex-wrap items-center justify-between gap-3">
      <div class="min-w-0"><div class="font-bold text-sm">${esc(sg.text)}</div>
        <div class="text-[11px] text-slate-500 mt-0.5"><b class="font-mono">${sg.audit_id}</b> · ${esc(sg.desc)} · ${sg.events} ${t('l_times')}: ${t('l_auto')} → ${t('l_manual')} <b>${t('sev_' + sg.target)}</b></div>
        ${sg.examples.map(x => `<div class="text-[11px] text-slate-400 truncate">• ${esc(x.time)} · ${esc(x.actor)} · ${esc(x.vendor)} · ${x.auto} → ${x.manual} · ${esc(x.issue)}</div>`).join('')}</div>
      <div class="flex gap-1.5"><button onclick="learnAct('dismiss', '${encodeURIComponent(sg.key)}')" class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-bold">${t('l_dismiss')}</button>
        <button onclick="learnAct('apply', '${encodeURIComponent(sg.key)}', '${encodeURIComponent(sg.text)}')" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-bold">${t('l_apply')}</button></div></div>`).join('') : `<div class="card p-8 text-center text-sm text-slate-400">${t('l_none')}</div>`}</div>
    <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
      <div class="card"><div class="px-4 py-2.5 border-b lbl !mb-0">${t('l_events')} (${sm.total_events})</div><div class="divide-y divide-slate-100 max-h-72 overflow-y-auto scroll">${sm.events.map(e => `<div class="px-4 py-2 text-xs"><b class="font-mono">${e.audit_id}</b> · ${e.auto} → <b>${e.manual}</b> · ${esc(e.actor)} · ${esc(e.vendor)}<div class="text-slate-400">${esc(e.time)}</div></div>`).join('') || '<div class="p-4 text-xs text-slate-400">—</div>'}</div></div>
      <div class="card"><div class="px-4 py-2.5 border-b lbl !mb-0">${t('l_applied')}</div><div class="divide-y divide-slate-100 max-h-72 overflow-y-auto scroll">${sm.applied.map(a => `<div class="px-4 py-2 text-xs">${esc(a.text)}<div class="text-slate-400">${esc(a.time)} · ${esc(a.by)}</div></div>`).join('') || '<div class="p-4 text-xs text-slate-400">—</div>'}</div></div></div>`;
}
async function learnAct(action, keyEnc, textEnc) {
  if (action === 'apply') { const d = await dialog({ title:t('l_apply_title'), message:decodeURIComponent(textEnc || ''), okText:t('l_apply') }); if (!d.ok) return; }
  const r = await api('api/admin/learning/' + action, { key:decodeURIComponent(keyEnc) });
  if (r.status !== 'ok') return toast(r.message, 'err');
  MASTER = null; toast(t('msg_saved')); accLearning();
}

function accLogs() {
  const logs = (SESSION.admin_data || {}).audit_logs || [];
  accBody.innerHTML = `<h3 class="text-lg font-black mb-4">${t('acc_logs')}</h3>
    <div class="card divide-y divide-slate-100">${logs.map(l => `<div class="px-4 py-2.5 flex justify-between gap-4 text-sm"><div><b>${esc(l.actor)}</b> <span class="text-slate-600">${esc(l.action)}</span></div><span class="font-mono text-[11px] text-slate-400 shrink-0">${esc(l.time)}</span></div>`).join('')}</div>`;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape' && ACC_OPEN) closeAccount(); });
window.__rbaReady.then(boot);
</script>
</body>
</html>
